<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpusClip Preview — {{PROJECT_TITLE}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 2rem; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
    .clips { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; }
    .clip { background: #161616; border-radius: 16px; overflow: hidden; width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); transition: transform 0.2s; }
    .clip:hover { transform: translateY(-4px); }
    .clip video { width: 100%; display: block; background: #000; }
    .clip-info { padding: 1rem; }
    .clip-rank { display: inline-block; background: #7c3aed; color: #fff; font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-bottom: 0.5rem; }
    .clip-score { display: inline-block; background: #1e3a2f; color: #34d399; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-bottom: 0.5rem; margin-left: 0.25rem; }
    .clip-duration { display: inline-block; background: #1e293b; color: #60a5fa; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-bottom: 0.5rem; margin-left: 0.25rem; }
    .clip-title { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 0.4rem; line-height: 1.3; }
    .clip-desc { font-size: 0.8rem; color: #999; line-height: 1.4; margin-bottom: 0.6rem; }
    .clip-tags { font-size: 0.75rem; color: #7c3aed; line-height: 1.4; word-break: break-all; }
    .scores { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .scores span { font-size: 0.7rem; color: #888; background: #1a1a1a; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>{{PROJECT_TITLE}}</h1>
  <p class="subtitle">{{CLIP_COUNT}} clips · Generated by OpusClip</p>
  <div class="clips">
{{CLIP_CARDS}}
  </div>
</body>
</html>
